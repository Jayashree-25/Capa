services:
  db:
    image: postgres:16-alpine
    container_name: capa-db
    environment:
      POSTGRES_USER: capa
      POSTGRES_PASSWORD: capa
      POSTGRES_DB: capa
    ports:
      - "5432:5432"
    volumes:
      - capa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capa -d capa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  capa-pgdata:
